version: 2

sources:
  - name: raw
    description: |
      Raw OpenF1 API data ingested by Apache Airflow into the `raw` schema.
      Each table is fully replaced on every DAG run.
    schema: raw
    tables:
      - name: meetings_raw
        description: >
          Race weekend metadata from the OpenF1 `/v1/meetings` endpoint
          (circuit, country, dates, official names).
        columns:
          - name: meeting_key
            description: Unique identifier for a race weekend.
          - name: circuit_short_name
            description: Short circuit name.
          - name: country_code
            description: ISO country code.
          - name: country_name
            description: Country name.
          - name: date_start
            description: ISO datetime the weekend starts.
          - name: gmt_offset
            description: Timezone offset of the meeting.
          - name: location
            description: City/location of the circuit.
          - name: meeting_name
            description: Short meeting name.
          - name: meeting_official_name
            description: Official meeting name.
          - name: year
            description: Championship year.
          - name: source
            description: Ingestion source tag.
          - name: ingestion_time
            description: Timestamp the row was ingested.

      - name: weather_raw
        description: >
          Weather conditions per session from the OpenF1 `/v1/weather` endpoint
          (air/track temperature, humidity, wind, rainfall).
        columns:
          - name: session_key
            description: Unique identifier of the session the reading belongs to.
          - name: meeting_key
            description: Unique identifier of the race weekend the reading belongs to.
          - name: date
            description: ISO datetime of the reading.
          - name: air_temperature
            description: Air temperature in Celsius.
          - name: track_temperature
            description: Track temperature in Celsius.
          - name: humidity
            description: Relative humidity in percent.
          - name: pressure
            description: Atmospheric pressure in hPa.
          - name: rainfall
            description: Rainfall flag (0 or 1).
          - name: wind_direction
            description: Wind direction in degrees.
          - name: wind_speed
            description: Wind speed in km/h.
          - name: source
            description: Ingestion source tag.
          - name: ingestion_time
            description: Timestamp the row was ingested.

      - name: sessions_raw
        description: >
          Session metadata from the OpenF1 `/v1/sessions` endpoint
          (session type/name, dates, circuit, meeting reference).
        columns:
          - name: session_key
            description: Unique identifier of the session.
          - name: session_type
            description: Type of session (Practice, Qualifying, Race, ...).
          - name: session_name
            description: Display name of the session.
          - name: date_start
            description: ISO datetime the session starts.
          - name: date_end
            description: ISO datetime the session ends.
          - name: meeting_key
            description: Unique identifier of the race weekend.
          - name: circuit_key
            description: Unique identifier of the circuit.
          - name: circuit_short_name
            description: Short circuit name.
          - name: country_key
            description: Unique identifier of the country.
          - name: country_code
            description: ISO country code.
          - name: country_name
            description: Country name.
          - name: location
            description: City/location of the circuit.
          - name: gmt_offset
            description: Timezone offset of the session.
          - name: year
            description: Championship year.
          - name: is_cancelled
            description: Whether the session was cancelled.
          - name: source
            description: Ingestion source tag.
          - name: ingestion_time
            description: Timestamp the row was ingested.

      - name: drivers_raw
        description: >
          Driver registration info per session from the OpenF1 `/v1/drivers`
          endpoint (identity, team, broadcast names).
        columns:
          - name: meeting_key
            description: Unique identifier of the race weekend.
          - name: session_key
            description: Unique identifier of the session.
          - name: driver_number
            description: Race number of the driver.
          - name: broadcast_name
            description: Name as shown on broadcast overlays.
          - name: full_name
            description: Full name of the driver.
          - name: name_acronym
            description: Three-letter acronym for the driver.
          - name: team_name
            description: Name of the team the driver raced for.
          - name: team_colour
            description: Hex colour of the team.
          - name: first_name
            description: First name of the driver.
          - name: last_name
            description: Last name of the driver.
          - name: headshot_url
            description: URL of the driver headshot.
          - name: country_code
            description: Nationality country code.
          - name: source
            description: Ingestion source tag.
          - name: ingestion_time
            description: Timestamp the row was ingested.
